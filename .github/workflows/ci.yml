name: ci

# Least privilege: the harness job only checks out and runs tests.
permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build isolated execution sandbox
        run: docker build -f Dockerfile.sandbox -t emox-sandbox:latest .
      - name: Install locked development dependencies
        run: uv sync --extra dev --frozen --no-install-project
      - name: Static syntax check (compileall)
        run: python3 -m compileall -q shared suites generators judges health mcp-server adapters tests tools
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy isolated security modules
        run: uv run --frozen mypy shared/sandbox.py shared/bundles.py shared/environment.py
      - name: Secrets scan (fail on real credentials)
        # Synthetic markers (FAKE-, EMO{SYNTH_) are expected fixtures.
        # Exclude: fixtures, security-bench fixtures, PROMPT_PACK (Arabic
        # test prompts), generated security-board reports.
        run: |
          ! rg -n --pcre2 "(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|(?i:api[_-]?key\s*[:=]\s*['\"][^'\"]{8,}|password\s*[:=]\s*['\"][^'\"]{6,}|bearer\s+[A-Za-z0-9\-_.]{16,}))" \
            --glob '!suites/security/fixtures/*' \
            --glob '!security-bench/fixtures/*' \
            --glob '!shared/PROMPT_PACK_v1.md' \
            --glob '!reports/*' \
            shared suites generators judges health mcp-server adapters tests prompts || exit 1
          echo "secrets scan clean"
      - name: Dangerous-pattern guard (no shell/eval/exec/pickle)
        run: |
          ! rg -n "shell\s*=\s*True|os\.system|import pickle|[^_.a-zA-Z]eval\(|[^_.a-zA-Z]exec\(" \
            --glob '*.py' shared suites generators judges health mcp-server adapters tests || exit 1
          echo "dangerous-pattern scan clean"
      - name: Local-only files guard (never track internal docs)
        run: |
          tracked=$(git ls-files AGENTS-X.md FINAL-REPORT.md PLAN-Y.md REVIEW-X.md | head -5) || true
          tracked="$tracked $(git ls-files 'reports/*' ':!reports/BASELINE_*' | head -5)" || true
          tracked=$(echo "$tracked" | tr -s ' ' | sed 's/^ *//')
          [ -z "$tracked" ] || (echo "FORBIDDEN TRACKED FILES: $tracked (see CONTRIBUTING)"; exit 1)
          echo "local-only guard clean (reports/BASELINE_* explicitly allowed)"
      - name: Harness self-test (SPEC 35, fail-closed)
        run: uv run --frozen python shared/run.py --self-test
      - name: Full test suites
        run: |
          set -o pipefail
          uv run --frozen python tests/run_all.py 2>&1 | tee test-output.log
      - name: Coverage gate (shared, fail-under=70)
        run: |
          export PYTHONPATH="$PWD:$PWD/shared:$PYTHONPATH"
          rm -f .coverage .coverage.*
          for suite in harness generators scoring golden; do
            uv run --frozen coverage run --parallel-mode --source=shared -m unittest discover -s tests/$suite
          done
          uv run --frozen coverage combine
          uv run --frozen coverage report --fail-under=70
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: warn
