[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emo-x-eval"
version = "2.0.0-rc1"
description = "Adaptive, execution-based evaluation of AI coding models and agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["benchmark", "llm-evaluation", "ai-agents", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = ["pytest>=7", "coverage>=7", "build", "twine"]
docs = ["sphinx"]

[project.scripts]
emo = "emox.cli:main"

[project.urls]
Homepage = "https://github.com/SE-Emam/EMO-X"
Documentation = "https://github.com/SE-Emam/EMO-X/blob/main/SPEC.md"
Issues = "https://github.com/SE-Emam/EMO-X/issues"
Changelog = "https://github.com/SE-Emam/EMO-X/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emox = ["py.typed"]
